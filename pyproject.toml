[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-neural-compiler"
version = "0.1.0"
description = "LLM-guided neural compilation for real-time UAV edge inference"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "onnx>=1.16",
  "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
yolo = ["ultralytics>=8.2"]
vision = ["ultralytics>=8.2", "timm"]

[project.scripts]
nnc = "compiler.cli:main"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]
"ros2_ws/src/**/*.py" = ["E402"]
"**/__init__.py" = ["F401"]
"compiler/llm/groq_client.py" = ["F401"]

[tool.setuptools]
packages = [
  "compiler",
  "compiler.catalog",
  "compiler.cli",
  "compiler.data",
  "compiler.exporters",
  "compiler.frontends",
  "compiler.graph",
  "compiler.hardware",
  "compiler.history",
  "compiler.llm",
  "compiler.optimization",
  "compiler.parsers",
  "compiler.pipeline",
  "compiler.planner",
  "compiler.profiling",
  "compiler.report",
  "compiler.schema",
  "compiler.utils",
  "compiler.verification",
  "nnc",
  "nnc.backends",
]

[tool.setuptools.package-dir]
"" = "."
"nnc" = "src/nnc"
"nnc.backends" = "src/nnc/backends"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
addopts = "-q"
markers = [
  "integration: optional large ONNX zoo tests; skipped unless NNC_RUN_ZOO=1",
]
