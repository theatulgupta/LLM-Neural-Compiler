name: ci

on:
  push:
    branches: [llm-advisor, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: ruff check compiler src scripts tests ros2_ws/src
      - name: Pytest
        run: |
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          pytest -q
