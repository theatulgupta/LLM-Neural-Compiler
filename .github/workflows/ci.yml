name: ci

# Correctness only. Thesis p50 is measured on the aarch64 host, not on this x86 runner.

on:
  push:
    branches: [llm-advisor, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e '.[dev]'
      - name: Ruff
        run: |
          ruff check compiler src scripts tests
          ruff format --check compiler src scripts tests
      - name: Secrets
        run: python scripts/check_secrets.py
      - name: Pytest
        run: |
          export PYTEST_DISABLE_PLUGIN_AUTOLOAD=1
          pytest -q
